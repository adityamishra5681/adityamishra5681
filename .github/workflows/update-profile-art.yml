name: Update Profile Art

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  update-contribution-graph:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-local.txt -r scripts/requirements.txt
      
      - name: Fetch contributions
        run: |
          python scripts/fetch_contributions.py
      
      - name: Render heatmap
        run: |
          python scripts/render_heatmap_svg.py
      
      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add contrib-heatmap.svg contributions.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update contribution graph" && git push)
